# Netlify deploy: static Vite app in dist/ plus one function serving every /api/* route.
# Set GEMINI_API_KEY and YARNGPT_API_KEY under Site configuration → Environment variables.

[build]
  # Static frontend only; the Express server (dist/server.cjs) and Vercel bundle aren't needed here.
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # firebase-admin is bundled on purpose: its jwks-rsa -> jose chain is ESM-only, and
  # left as node_modules it crashes the function with "require() of ES Module".
  # Bundling converts it to CommonJS. Only firebase-admin/app and /auth are used.
  external_node_modules = ["@google/genai"]

# API first, then the single-page-app fallback. Order matters.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
